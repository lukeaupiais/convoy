name: DeepThought integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-adapter:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CONVOY_TEST_DEEPTHOUGHT_PYTHON: /tmp/convoy-deepthought-sdk/bin/python
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CONVOY_TEST_COMPILED_WORKER: ./dist-worker/convoy-worker-linux-x64
      CONVOY_TEST_DEEPTHOUGHT_SSH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.21'
      - name: Provision isolated runtime and pinned SDK
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap openssh-server
          sudo mkdir -p /run/sshd
          python -m venv /tmp/convoy-deepthought-sdk
          /tmp/convoy-deepthought-sdk/bin/python -m pip install 'deepthought-analysis-engine[python,typescript,scip] @ git+https://github.com/lukeaupiais/DeepThought.git@5e80a0074566e4d890a41f6d453f94cda44289d5'
          npm ci
      - name: Validate consumer architecture and build
        run: |
          npm run check:architecture
          npm run check:docs
          npm run build
          npm run build:worker
      - name: Exercise real SDK, runner and portable worker integration
        timeout-minutes: 3
        run: node --test --test-timeout=60000 --test-concurrency=1 tests/acceptance/deepthought.test.mjs tests/acceptance/deepthought-ssh.test.mjs tests/modules/deepthought-extension.test.mjs tests/runner/deepthought*.test.mjs tests/runner/working-directory.test.mjs
